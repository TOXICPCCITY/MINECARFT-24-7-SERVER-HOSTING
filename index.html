<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perzaan AFK Bot - Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(45, 212, 191, 0.2);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            text-align: center;
            border: 1px solid #334155;
        }

        h1 {
            color: #ccfbf1;
            font-size: 1.8rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-dot {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            display: inline-block;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%   { opacity: 1;   transform: scale(1); }
            50%  { opacity: 0.5; transform: scale(1.15); }
            100% { opacity: 1;   transform: scale(1); }
        }

        .stat-card {
            background: #0f172a;
            padding: 15px 20px;
            margin: 15px 0;
            border-radius: 12px;
            border-left: 5px solid #2dd4bf;
            text-align: left;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
        }

        .label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .value {
            font-size: 18px;
            font-weight: bold;
            color: #2dd4bf;
            text-shadow: 0 0 10px rgba(45, 212, 191, 0.5);
            margin-top: 5px;
            word-break: break-word;
        }

        .btn-guide {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #2dd4bf;
            color: #0f172a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(45, 212, 191, 0.4);
            transition: transform 0.2s;
        }

        .btn-guide:hover {
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>
            <span class="status-dot"></span>
            Perzaan AFK Bot
        </h1>

        <div class="stat-card">
            <div class="label">Bot Status</div>
            <div class="value">Online (Managed on Render)</div>
        </div>

        <div class="stat-card">
            <div class="label">Bot Username</div>
            <div class="value">PerzaanLive</div>
        </div>

        <div class="stat-card">
            <div class="label">Server</div>
            <div class="value">leaf-village9090.aternos.me:12737</div>
        </div>

        <div class="stat-card">
            <div class="label">Version</div>
            <div class="value">Minecraft 26.2</div>
        </div>

        <div class="stat-card">
            <div class="label">Purpose</div>
            <div class="value">24/7 Aternos Keep-Alive</div>
        </div>

        <a href="https://docs.google.com/document/d/1Fl0dRzP6O30ehp5-QcaB11IobF8I1JJhKUipzCWiCYA/edit?tab=t.0" class="btn-guide" target="_blank">View Setup Guide</a>

        <div class="footer">
            &copy; 2026 Perzaan AFK Bot · Powered by Mineflayer
        </div>
    </div>

</body>
</html>
